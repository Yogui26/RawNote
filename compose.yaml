services:
  rawnote:
    # Image publiée par la CI à chaque release ; `docker compose up -d --build` la reconstruit localement.
    image: ghcr.io/yogui26/rawnote:latest
    build: .
    container_name: rawnote
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

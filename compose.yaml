services:
  rawnote:
    # Image construite et publiée par GitHub Actions (push sur main et tags vX.Y.Z).
    image: ghcr.io/yogui26/rawnote:latest
    pull_policy: always
    container_name: rawnote
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
